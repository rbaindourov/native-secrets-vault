name: Native Secrets Vault CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-vault:
    name: Build & Cryptographic Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install devDependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run Shamir GF(256), Envelope AES-256-GCM & KV v2 Test Suite
        run: npm test
